<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plotting On Surfaces — Teaching 3D Math</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <noscript>This app requires JavaScript enabled.</noscript>
    <div class="layout">
      <!-- Upper-left: 3D plotting area -->
      <section class="plot-section">
        <div id="app" aria-label="3D plotting area"></div>
        <div id="ui" aria-label="controls">
          <div id="toolbar">
            <button id="homeBtn" type="button" title="Reset view to home">Home</button>
          </div>
          <div id="controls" aria-label="plot controls">
            <label> R
              <input id="rSlider" type="range" min="4" max="50" step="1" value="20" />
              <span id="rValue">20</span>
            </label>
          </div>
        </div>
      </section>

      <!-- Upper-right: practice problem (paraboloids only) -->
      <section class="practice-section" aria-labelledby="practice-title">
        <h2 id="practice-title">Paraboloid point plotting</h2>
        <p id="problemEquation" class="equation">z = 0.50 x² + 0.50 y² + 0.00</p>
        <p id="givenXY" class="given">Given: x = ?, y = ?</p>

        <div class="inputs">
          <label> x
            <input id="inputX" type="number" step="0.1" inputmode="decimal" />
          </label>
          <label> y
            <input id="inputY" type="number" step="0.1" inputmode="decimal" />
          </label>
          <label> z
            <input id="inputZ" type="number" step="0.1" inputmode="decimal" />
          </label>
        </div>

        <div class="actions">
          <button id="submitBtn" type="button">Plot point</button>
          <button id="newProblemBtn" type="button">New problem</button>
        </div>

        <div id="feedback" class="feedback" aria-live="polite"></div>
      </section>

      <!-- Lower row: leave room for notes, hints, or a worksheet embed later -->
      <section class="notes-section">
        <h3>Notes</h3>
        <p>Click New problem to generate a new paraboloid equation and a pair (x, y). Type the given x and y in the boxes, compute z from the equation, and plot the point. Use R to zoom the square domain.</p>
      </section>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
  </html>
